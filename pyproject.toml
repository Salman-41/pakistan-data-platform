[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pakistan-data-platform"
version = "0.1.0"
description = "Provenance-first Pakistan public statistics warehouse and analytics"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2,<4", "numpy>=2,<3", "polars>=1.20,<2", "pyarrow>=18,<24", "duckdb>=1.3.2,<1.4", "scikit-learn>=1.6,<2", "scipy>=1.14,<2", "statsmodels>=0.14,<1", "geopandas>=1,<2", "joblib>=1.4,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "redis>=5,<7", "alembic>=1.14,<2", "requests>=2.32,<3", "openpyxl>=3.1,<4", "lxml>=5,<7", "beautifulsoup4>=4.12,<5", "pypdf>=5,<7"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[tool.setuptools.packages.find]
where = [".", "apps/api"]
include = ["pipelines*", "ml*", "pakdata*","warehouse*"]
[tool.pytest.ini_options]
pythonpath = [".", "apps/api"]
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 120
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
